bio: |
  Mohammed Khalilia (محمد [عبد الستار قاسم](https://ar.wikipedia.org/wiki/%D8%B9%D8%A8%D8%AF_%D8%A7%D9%84%D8%B3%D8%AA%D8%A7%D8%B1_%D9%82%D8%A7%D8%B3%D9%85)) is a researcher, computer scientist, and data scientist with a PhD in Computer Science
  from the University of Missouri. Following his doctorate, he joined Georgia Tech's Computational Science and Engineering school and Emory University as a Postdoctoral Fellow, where his research spanned predictive modeling,
  relational cluster analysis, and health and nursing informatics.

  He then spent nearly five years at Amazon, working across Amazon Web Services (AWS) and Amazon Studios in natural language processing (NLP), speech synthesis, and computer vision. In 2018, he was part of the team that launched
  [Comprehend Medical](https://aws.amazon.com/comprehend/medical/), Amazon's NLP service for clinical and biomedical text. At Qualtrics, he developed the company's first fine-tuned large language model, trained [synthetic sampling](https://www.qualtrics.com/support/survey-platform/distributions-module/synthetic-panels/) model,
  and worked on conversational machine learning, and active learning.

  He is also an adjunct professor at Birzeit University, where he teaches NLP courses for doctoral students.


